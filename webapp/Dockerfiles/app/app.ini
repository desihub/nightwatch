[uwsgi]
protocol = http
module = app
callable = app
master = true
pyargv = "-i ./static -d ./static"

processes = 5
single-interpreter = true

http-socket = :5000
vacuum = true

die-on-term = true

# allow large Cookie headers (e.g. .lbl.gov _ga cookies); default 4096 caused 502
buffer-size = 32768
